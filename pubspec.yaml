name: cars_wheels_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  isar_community: ^3.4.1
  isar_community_flutter_libs: ^3.4.1
  path_provider: ^2.1.6
  animate_do: ^5.1.0
  animations: ^3.0.0
  google_fonts: ^9.0.0
  material_symbols_icons: ^4.2960.0
  dio: ^5.11.1
  go_router: ^18.1.4
  cached_network_image: ^4.0.7
  flutter_svg: ^2.3.4
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_community_generator: ^3.4.1
  build_runner: ^2.16.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/google_fonts/

# Los colores repiten AppColors.ink y AppColors.accent; los protege una prueba.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon_full.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0F1115"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"

flutter_native_splash:
  color: "#0F1115"
  image: assets/branding/splash_logo.png
  color_dark: "#0F1115"
  image_dark: assets/branding/splash_logo.png
  web: false
  fullscreen: true
  android_12:
    color: "#0F1115"
    image: assets/branding/splash_logo.png
    icon_background_color: "#0F1115"
    color_dark: "#0F1115"
    image_dark: assets/branding/splash_logo.png
    icon_background_color_dark: "#0F1115"
